# Publishing exclusions.
#
# GitHub Pages builds this repository with Jekyll, and Jekyll turns every
# front-matter-less .md into a page. So these internal documents would be
# reachable on the customer domain, both as the .md source and as the .html
# twin Jekyll generates from it. Excluding them here removes both:
#
#   README.md              Repo README: publish pipeline, layout, internal notes
#   partials/              Raw footer markup source (the pages carry it inline)
#   new-design/*.md        Internal specs and screenshot changelogs
#
# Supplying an exclude list replaces Jekyll's default ["CNAME"], so CNAME is
# listed explicitly below.
#
# LICENSE stays public. The new-design/ sandbox pages stay published; they
# are already noindex,nofollow and Disallowed in robots.txt.
exclude:
  - CNAME
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - partials
  - new-design/SEO-KIT.md
  - new-design/screenshots/README.md
  - new-design/screenshots/README-example-page-footer-color.md
  - new-design/screenshots/README-example-page-polish.md
  - new-design/screenshots/README-example-page-shared-footer.md
  - new-design/screenshots/README-water-heater-fixes.md
