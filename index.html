<script>
(function(){
  function movePortfolioCards(){
    try {
      const gallery = document.querySelector('#gallery .grid');
      if(!gallery) return;
      const cards = Array.from(gallery.children);
      const first = cards.find(c => {
        const img = c.querySelector('img');
        return img && /Jack and Jill double bathroom sink with black faucets and marble trim/i.test(img.getAttribute('src')||'');
      });
      const second = cards.find(c => {
        const img = c.querySelector('img');
        return img && /Jack and Jill double bathroom sink with bronzed gold faucets/i.test(img.getAttribute('src')||'');
      });
      if(first) gallery.prepend(first);
      if(second) gallery.insertBefore(second, gallery.children[1] || null);
    } catch(e) {}
  }
  if(document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', movePortfolioCards);
  } else {
    movePortfolioCards();
  }
  // React may render after DOMContentLoaded, run a couple retries.
  setTimeout(movePortfolioCards, 400);
  setTimeout(movePortfolioCards, 1200);
})();
</script>


<script>
(function initBeforeAfterFix(){
  function setup(){
    const about=document.getElementById('about');
    if(!about) return false;
    const wraps=[...about.querySelectorAll('.cursor-ew-resize')];
    // choose largest interactive wrapper (not tiny handle)
    const wrapper=wraps.sort((a,b)=>b.getBoundingClientRect().width-a.getBoundingClientRect().width)[0];
    if(!wrapper || wrapper.dataset.baFixed==='1') return !!wrapper;
    const overlay=wrapper.querySelector('div[style*="clip-path"]');
    const divider=wrapper.querySelector('.absolute.top-0.bottom-0.w-1');
    const handle=divider && divider.querySelector('.absolute.top-1/2');
    if(!overlay || !divider) return false;
    wrapper.dataset.baFixed='1';
    let dragging=false;
    const setPos=(clientX)=>{
      const rect=wrapper.getBoundingClientRect();
      const x=Math.max(0,Math.min(rect.width, clientX-rect.left));
      const pct=(x/rect.width)*100;
      overlay.style.clipPath=`inset(0 ${100-pct}% 0 0)`;
      divider.style.left=pct+'%';
    };
    const start=(e)=>{dragging=true; const x=e.touches?e.touches[0].clientX:e.clientX; setPos(x); e.preventDefault&&e.preventDefault();};
    const move=(e)=>{if(!dragging) return; const x=e.touches?e.touches[0].clientX:e.clientX; setPos(x); e.preventDefault&&e.preventDefault();};
    const end=()=>{dragging=false;};
    wrapper.addEventListener('mousedown',start);
    window.addEventListener('mousemove',move,{passive:false});
    window.addEventListener('mouseup',end);
    wrapper.addEventListener('touchstart',start,{passive:false});
    window.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('touchend',end);
    if(handle){handle.style.touchAction='none';}
    wrapper.style.touchAction='none';
    return true;
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', setup);
  setTimeout(setup,300); setTimeout(setup,1200); setTimeout(setup,2500);
})();
</script>


<script>

})();
</script>


<script>
(function remapCenterNavLinks(){
  function run(){
    const navButtons=[...document.querySelectorAll('nav button')];
    if(!navButtons.length) return;
    let contactBtn=null;
    navButtons.forEach(btn=>{
      const txt=(btn.textContent||'').replace(/\u25BE/g,'').trim().toLowerCase();
      if(txt==='services') btn.onclick=()=>{ window.location.href='/services.html'; };
      if(txt==='contact') { btn.onclick=()=>{ window.location.href='/contact.html'; }; contactBtn=btn; }
      if(txt==='gallery' || txt==='portfolio') btn.onclick=()=>{ window.location.href='/services.html'; };
      if(txt==='faq') btn.onclick=()=>{ window.location.href='/faq.html'; };
    });
    const nav=contactBtn && contactBtn.parentElement;
    if(nav && !nav.querySelector('[data-home-faq-link="1"]')){
      const faqBtn=contactBtn.cloneNode(true);
      faqBtn.textContent='FAQ';
      faqBtn.setAttribute('data-home-faq-link','1');
      faqBtn.onclick=()=>{ window.location.href='/faq.html'; };
      nav.insertBefore(faqBtn, contactBtn);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', run);
  setTimeout(run,400); setTimeout(run,1200);
})();
</script>

<script>
(function addNavDropdowns(){
  var DROP_DEFS = {
    services: {
      wide: true,
      links: [
        ['/services.html','Services overview'],
        ['/water-heater-replacement-westminster-md.html','Water heater replacement'],
        ['/well-pump-repair-westminster-md.html','Well pump repair'],
        ['/water-softener-installation-westminster-md.html','Water softener installation'],
        ['/acid-neutralizer-installation-westminster-md.html','Acid neutralizer'],
        ['/hose-bib-replacement-westminster-md.html','Hose bib replacement'],
        ['/gas-leak-safety-westminster-md.html','Gas leak safety'],
        ['/gas-appliance-hookups.html','Gas appliance hookups'],
        ['/well-pumps.html','Well pumps overview'],
        ['/service-area.html','Service area']
      ]
    },
    faq: {
      wide: false,
      links: [
        ['/faq.html','All FAQs'],
        ['/service-area.html','Service area and towns'],
        ['/contact.html','Contact and request estimate']
      ]
    },
    contact: {
      wide: false,
      links: [
        ['/contact.html','Contact page'],
        ['tel:4437892897','Call 443-789-2897'],
        ['sms:4437892897','Text 443-789-2897'],
        ['mailto:afternoonplumbingcc@gmail.com','Email us']
      ]
    }
  };

  function labelOf(btn){
    // Button label excluding the injected caret span, so lookups keep
    // matching after the caret is added (retries, remap, clone relabel).
    var t = '';
    for (var i = 0; i < btn.childNodes.length; i++) {
      var n = btn.childNodes[i];
      if (n.nodeType === 1 && n.classList && n.classList.contains('home-nav-caret')) continue;
      t += n.textContent || '';
    }
    return t.trim().toLowerCase();
  }

  function findRow(){
    // The desktop nav buttons share one flex row inside <nav>.
    var buttons = document.querySelectorAll('nav button');
    for (var i = 0; i < buttons.length; i++) {
      var t = labelOf(buttons[i]);
      if (t === 'services' || t === 'contact') return buttons[i].parentElement;
    }
    return null;
  }

  function attach(row){
    // Panels are position:absolute; anchor them to the button row itself
    // so they do not latch onto some arbitrary positioned ancestor.
    if (getComputedStyle(row).position === 'static') row.style.position = 'relative';
    var buttons = Array.prototype.slice.call(row.querySelectorAll(':scope > button'));
    buttons.forEach(function(btn){
      var name = labelOf(btn);
      var def = DROP_DEFS[name];
      if (!def) return;
      // Caret indicator, same glyph as the static pages; idempotent across retries.
      if (!btn.querySelector('.home-nav-caret')) {
        var caret = document.createElement('span');
        caret.className = 'home-nav-caret';
        caret.setAttribute('aria-hidden', 'true');
        caret.textContent = '\u25BE';
        btn.appendChild(caret);
      }
      // Clone-safe idempotency: a relabeled clone (FAQ) carries stale attrs.
      if (btn.getAttribute('data-nav-drop') === name && row.querySelector('[data-nav-panel-for="' + name + '"]')) return;

      var stale = row.querySelector('[data-nav-panel-for="' + name + '"]');
      if (stale && stale !== btn) stale.parentNode.removeChild(stale);

      btn.setAttribute('data-nav-drop', name);
      btn.setAttribute('aria-haspopup', 'true');
      btn.setAttribute('aria-expanded', 'false');

      var panel = document.createElement('div');
      panel.className = 'home-nav-drop' + (def.wide ? ' wide' : '');
      panel.setAttribute('data-nav-panel-for', name);
      def.links.forEach(function(pair){
        var a = document.createElement('a');
        a.href = pair[0];
        a.textContent = pair[1];
        panel.appendChild(a);
      });
      row.appendChild(panel);

      var closeTimer = null;
      function position(){
        var br = btn.getBoundingClientRect();
        var rr = row.getBoundingClientRect();
        var pw = panel.offsetWidth || 280;
        var x = br.left - rr.left + br.width / 2 - pw / 2;
        var maxX = Math.max(8, rr.width - pw - 8);
        if (x > maxX) x = maxX;
        if (x < 8) x = 8;
        panel.style.left = x + 'px';
        panel.style.top = (br.bottom - rr.top + 6) + 'px';
      }
      function setOpen(open){
        panel.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) position();
      }
      function scheduleClose(){
        if (closeTimer) clearTimeout(closeTimer);
        closeTimer = setTimeout(function(){ setOpen(false); }, 140);
      }
      function cancelClose(){
        if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
      }

      btn.addEventListener('mouseenter', function(){ cancelClose(); setOpen(true); });
      btn.addEventListener('mouseleave', scheduleClose);
      panel.addEventListener('mouseenter', function(){ cancelClose(); setOpen(true); });
      panel.addEventListener('mouseleave', scheduleClose);

      btn.addEventListener('focusin', function(){ cancelClose(); setOpen(true); });
      panel.addEventListener('focusin', function(){ cancelClose(); setOpen(true); });
      row.addEventListener('focusout', function(e){
        if (!btn.contains(e.relatedTarget) && !panel.contains(e.relatedTarget)) setOpen(false);
      });
      row.addEventListener('keydown', function(e){
        if (e.key === 'Escape'){ setOpen(false); btn.focus(); }
      });
    });
  }

  function run(){
    var row = findRow();
    if (row) attach(row);
  }
  // The React nav renders after page load, and remapCenterNavLinks clones the
  // FAQ button in late; retries are idempotent (per-button guard above).
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  setTimeout(run, 400); setTimeout(run, 900); setTimeout(run, 1800); setTimeout(run, 3200);
})();
</script>
